apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: core-connector
  namespace: tailscale
spec:
  tailnet: core
  # Tailscale device identity
  replicas: 2
  hostnamePrefix: cluster-connector-core
  tags:
    - "tag:cluster-router"
  subnetRouter:
    advertiseRoutes:
      - "10.34.26.31/32" # Traefik VIP
      - "10.34.26.32/32" # Pi-hole DNS VIP
      - "10.34.26.33/32" # Minecraft VIP
