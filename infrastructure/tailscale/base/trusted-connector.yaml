apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: trusted-connector
  namespace: tailscale
spec:
  tailnet: trusted
  # Tailscale device identity
  replicas: 1
  hostnamePrefix: cluster-connector-trusted
  tags:
    - "tag:cluster-router"
  subnetRouter:
    advertiseRoutes:
      - "10.34.26.31/32" # Traefik VIP
      - "10.34.26.32/32" # Pi-hole DNS VIP
