apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  repo: https://pkgs.tailscale.com/helmcharts
  chart: tailscale-operator
  version: "1.104.1"
  valuesContent: |-
    installCRDs: true
    operatorConfig:
      hostname: k3s-tailscale-operator
      defaultTags:
        - "tag:cluster-operator"
      logging: "info"
      proxyConfig:
        defaultTags: "tag:k8s"
        firewallMode: auto
      ingressClass:
        enabled: false
      apiServerProxyConfig:
        mode: "false"
        allowImpersonation: "false"
      oauthSecretVolume:
        secret:
          secretName: operator-oauth
