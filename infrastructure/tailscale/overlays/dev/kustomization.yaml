apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tailscale
resources:
  - ../../base
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: core-oauth
    type: Opaque
    envs:
      - .env.core
  - name: trusted-oauth
    type: Opaque
    envs:
      - .env.trusted
  - name: guest-oauth
    type: Opaque
    envs:
      - .env.guest
