apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-test
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: longhorn-secrets
    type: Opaque
    envs:
      - .env
resources:
  - ../../base
  - longhorn-test.yaml
  - test-pod.yaml
  - test-pvc.yaml
