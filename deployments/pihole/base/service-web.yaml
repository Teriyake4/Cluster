apiVersion: v1
kind: Service
metadata:
  name: pihole-web
  namespace: pihole
spec:
  type: NodePort
  selector:
    app: pihole
  ports:
    - name: web
      port: 80
      targetPort: web
      protocol: TCP
      nodePort: 30080
    - name: web-tls
      port: 443
      targetPort: web-tls
      protocol: TCP
      nodePort: 30443
