apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-terminal
  namespace: open-webui
  labels:
     app: open-terminal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-terminal
  template:
    metadata:
      labels:
        app: open-terminal
    spec:
      containers:
        - name: open-terminal
          image: ghcr.io/open-webui/open-terminal:0.13.0
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: OPEN_TERMINAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: open-terminal-secrets
                  key: OPEN_TERMINAL_API_KEY
            - name: OPEN_TERMINAL_MULTI_USER
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /home
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-terminal-pvc
