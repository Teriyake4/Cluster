apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: open-webui
resources:
  - ../../base
patches:
  - target:
      kind: PersistentVolumeClaim
      name: open-terminal-pvc
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: longhorn-ssd
secretGenerator:
  - name: open-terminal-secrets
    envs:
      - .env
