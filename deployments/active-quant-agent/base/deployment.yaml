apiVersion: apps/v1
kind: Deployment
metadata:
  name: active-quant-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: active-quant-agent
  template:
    metadata:
      labels:
        app: active-quant-agent
    spec:
      containers:
        - name: active-quant-agent
          image: active-quant-agent:latest
          envFrom:
            - secretRef:
                name: active-quant-agent-env
