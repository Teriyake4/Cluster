apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: active-quant-agent
    newTag: "latest"
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: active-quant-agent
      spec:
        template:
          spec:
            containers:
              - name: active-quant-agent
                imagePullPolicy: Never
                env:
                  - name: LMS_BASE_URL
                    value: "http://lms:1234/v1"
