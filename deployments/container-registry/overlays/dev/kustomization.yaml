apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: container-registry
resources:
  - ../../base
patches:
  - target:
      kind: PersistentVolumeClaim
      name: registry-data
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: local-path
  - target:
      kind: PersistentVolumeClaim
      name: registry-data
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
