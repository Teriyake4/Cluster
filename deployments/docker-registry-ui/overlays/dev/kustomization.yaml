apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: container-registry
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: docker-registry-ui
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "El Matcha Registry (dev)"
