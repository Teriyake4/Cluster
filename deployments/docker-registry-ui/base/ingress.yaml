apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docker-registry-ui-ingress
  namespace: container-registry
spec:
  ingressClassName: traefik
  rules:
  - host: registry-ui.elmatcha.lan
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: docker-registry-ui
            port:
              number: 80
