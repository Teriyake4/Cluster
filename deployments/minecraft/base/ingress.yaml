apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minecraft-ingress
  namespace: minecraft
spec:
  ingressClassName: traefik
  rules:
    - host: minecraft.elmatcha.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minecraft-service
                port:
                  number: 25565
